<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="theme-color" content="#2f2850">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icons/favicon.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="filosofie app">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=6">
  <script src="/static/app.js?v=2" defer></script>
</head>
<body data-vapid="{{ vapid_public_key }}">
  <header class="topbar">
    <a class="brand" href="/"><span class="phi">φ</span><span>jeroen &amp; pep filosofie app</span></a>
    {% if user %}
    <div class="who">
      {% if user.is_admin %}<a href="/admin">Beheer</a>{% endif %}
      <a href="/installeer" title="Meldingen en installatie">{{ user.name }}</a>
    </div>
    {% endif %}
  </header>
  <main>
    {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% if user %}
  <footer class="tabbar">
    <nav aria-label="Hoofdmenu">
      <a href="/" class="{{ 'on' if nav == 'vragen' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
        Vragen
      </a>
      <a href="/avond" class="{{ 'on' if nav == 'avond' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        Avond
      </a>
    </nav>
  </footer>
  {% endif %}
</body>
</html>
